<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>ログイン画面</title>
</head>


<body class="UI_Build_Assistant">
  <header>
      <div class="header-container">  
          <div class="header-siteName">
            <a href="#"><img src="images/JazzLog-logo-white.png" class="siteLogo"></a>
          </div>
      </div>
  </header>              

  <div class="main">
      <h1>Jazz Log にログイン</h1>
    <div class="login">
      <form action="" accept-charset="UTF-8" method="post">
      <div class="login_form">
         <input type="text" placeholder="アカウント名 or メールアドレス" name="account" required>
      </div>
      <div class="login_form">
         <input type="password" placeholder="パスワード" name="password" required>
      </div>
      <div class="pass">パスワードを忘れた場合</div>
      <div class="login_btn">
        <input type="submit" name="login" value="ログイン">
      </div> 
     </form> 
    </div>
  </div>

  <footer>
    <p><small> &copy; Jazz Log </small></p>
  </footer>
    
</body>
</html>
