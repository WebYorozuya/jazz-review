<!DOCTYPE html>
<html lang="jp">
  
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="signup.css">
    <title>新規アカウント登録</title>
</head>

<body>
    <header>
     <div class="header-container">
        <div class="header-start">
            <div class="header-siteName">
              <a href="#"><img src="images/JazzLog-logo-white.png" class="siteLogo"></a>
            </div>
        </div>
     </div>
    </header>

  <div class="main">
    
    <div class="welcome">
       <h1>Welcome to Jazz Log</h1>
    </div>
    <div class="signup_please">  
         <p>♪ 新規登録してね ♪</p>
    </div>
 
    <div class="signup">
      <form action="" accept-charset="UTF-8" method="post">
        <div class="signup_form">
            <label>アカウント名<input type="text" name="account" required></label>
            <input type="hidden" name="hidden" value="hidden">
        </div>
        <div class="signup_form"> 
            <label>メールアドレス<input type="email" name="email" required></label>
            <input type="hidden" name="hidden" value="hidden">
        </div>
        <div class="signup_form">
            <label>パスワード<input type="password" name="password" requiredt></label>
            <input type="hidden" name="hidden" value="hidden">
        </div>
        <div class="btn_signup">
           <input type="submit" name="commit" value="登録する">
           <input type="hidden" name="redirect_to" value="hidden">
        </div>
      </form> 
    </div>
    <hr>
    <div class="access">
       <div class="login">すでにアカウントをお持ちの場合 ：<a href="#">ログイン</a></div>
       <div class="not_signup">登録せずに利用する場合 ：<a href="#">こちら</a></div>
       
    </div>
  </div>

  <footer>
    <p><small>&copy; Jazz Log</small></p>
  </footer>

</body>


</html>
