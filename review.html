<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="review.css">

    <title>review</title>
</head>
<body>
    <div class="main_container">
      <h1>review</h1>
      <div class="form">
        <form action="#" method="post">
         <div class="input_field">
           <label>日付</label>
           <input type="date" name="date">
         </div>
         <div class="input_field">
           <label>プレイヤー</label>
           <input type="text" name="player">
         </div>
         <div class="input_field">
           <label>ライブハウス</label>
           <input type="text" name="livehouse">
         </div>
         <div class="input_field">
           <label>料金</label>
            <input type="text" name="fee">
         </div>
         <div class="input_field">
          <label>レビュー</label>
           <textarea name="review" cols="40" rows="8"></textarea> 
         </div>
         <div class="upload">
           <input type="submit" value="投稿する">
         </div>
        </div>
       </form>
    </div>
    
</body>
</html>
