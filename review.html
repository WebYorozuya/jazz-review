<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>レビュー投稿</title>
    <link rel="icon" href="images/favicon.ico" />
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.1.1/css/all.css" integrity="sha384-O8whS3fhG2OnA5Kas0Y9l3cfpmYjapjI0E4theH4iuMD+pLhbf6JI0jIMfYcK3yZ" crossorigin="anonymous"></link>
    <link rel="stylesheet" href="review.css" />
  </head>

  <body class="UI_Build_Assistant">
    <header>
      <div class="header-container">
        <div class="header-start">
          <div class="header-siteName">
            <a href="#"
              ><img src="images/JazzLog-logo-white.png" class="siteLogo"
            /></a>
          </div>
          <from
            class="header-search"
            action="cgi-bin/example.cgi"
            method="post"
          >
            <div id="search-units">
              <input
                class="header-search-btn"
                type="submit"
                name="submit"
                value=""
              />
              <i class="fas fa-search"></i>
              <input
                id="header-search-text"
                type="search"
                name="search"
                placeholder="キーワードで検索"
              />
              <input id="header-search-text-checkBox" type="checkbox" />
            </div>
            <!-- /#search-units" -->
          </from>
        </div>
        <!-- /.header-start -->
        <div class="header-end">
          <!-- /.header-post -->
          <div class="header-loginUser">
            <input
              id="header-loginUser-acd-check"
              class="header-loginUser-acd-check"
              type="checkbox"
            />
            <label
              class="header-loginUser-acd-label"
              for="header-loginUser-acd-check"
            >                       
             <i class="far fa-user-circle fa-2x"></i>
             <div class="space"></div>
             <i class="fas fa-caret-down  fa-lg"></i></label>

              </label>
            <div class="header-loginUser-acd-content">
              <a href="#">
                <div class="header-loginUser-acd-content-login">ログイン</div>
              </a>
              <a href="#">
                <div class="header-loginUser-acd-content-logout">
                  ログアウト
                </div>
              </a>
              <a href="#">
                <div class="header-loginUser-acd-content-account">
                  アカウント登録
                </div>
              </a>
            </div>
            <!-- /.header-loginUser-acd-content -->
          </div>
          <!-- /.header-loginUser -->
        </div>
        <!-- /.header-end -->
      </div>
      <!-- /.header-container -->
    </header>
    <div class="home">
      <nav>
        <ul class="pc-nav">
          <li>
            <a href="#" class="top-li-newInformation"
              ><i class="fas fa-music fa-lg"></i><span>新着レビュー</span></a>
          </li>
          <li>
            <a href="#" class="top-li-player"><i class="fas fa-users fa-lg"></i><span>レビュワータグ</span></a>
              
          </li>
          <li>
            <a href="#" class="top-li-livehouse"
              ><i class="fas fa-home fa-lg"></i><span>ライブハウスタグ</span></a>
            </li>
        <li>
          <a href="#" class="top-li-review"
          ><i class="fas fa-pencil-alt fa-lg"></i><span>投稿する</span></a>
        </li>
        <li>
          <a href="#" class="top-li-contact"
          ><i class="fab fa-connectdevelop fa-lg"></i><span>contact</span></a>
        </li>
      </ul>
        <!-- /.pc-nav -->
        <div class="mobile-nav">
          <form method="get" action="" class="mobile-nav-form">
            <div class="pulldown">
              <select name="pulldown" class="pulldown-option" required>
                <option value="">選択してください</option>
                <option value="選択肢1">新着順</option>
                <option value="選択肢2">プレイヤー</option>
                <option value="選択肢3">ライブハウス</option>
              <!-- <option value="選択肢4">投稿する</option>
              <option value="選択肢5">contact</option>
               -->
              </select>
            </div>
            <div class="pulldown-select">
              <input type="submit" value="選択" />
            </div>
          </form>
        </div>
        <!-- /.mobile-nav -->
      </nav>
      <div class="right-container">
        <!-- レビュー投稿ページ -->
        <main>
          <div class="form_container">
            <div class="left"></div>
            <form action="insert" id="create-account" method="POST">
              <h1>{{$user}}さん<br />ライブの感想を記録しましょう</h1>
              <input type="hidden" name="user_id" value="id" />
              <!-- <h1>{{$user->name}}さん<br />ライブの感想を記録しましょう</h1>
              <input type="hidden" name="user_id" value="{{$user->id}}" A /> -->
<div class="review-field">
              <div class="input-field">
                <label for="live_date">ライブに行った日</label>
                <input
                  type="date"
                  id="live_date"
                  name="live_date"
                  class="input-date"
                />
              </div>
              <div class="input-field">
                <label for="title" class="title">レビューのタイトル</label>
                <input type="text" id="title" name="title" required />
              </div>
              <div class="input-field">
                <label for="tag" class="tag">タグ</label>
                <input type="text" id="tag" name="tag" required />
              </div>
              <div class="input-field">
                <label for="text" class="text">ライブの感想</label>
                <textarea name="text" id="text" cols="30" rows="10"></textarea>
                <p style="text-align: right; font-size: 0.8rem">
                  （1000文字以内）
                </p>
              </div>
              <div class="review-right"></div>
            </div>
              <div class="upload">
                <input type="submit" value="投稿" class="upload_btn" />
              </div>
            </form>
          </div><!-- /.form_container -->
          </main>
        <aside>
          <!-- <a href="#">
                          <div class="ad1">advertisement1</div>
                      </a>
                      <a href="#">
                          <div class="ad2">advertisement2</div>
                      </a> -->
        </aside>

      </div>
    </div>
    <footer>
      <div class="footer-container">
        <div class="footer-left">
          <div class="footer-left">
            <a href="#"
              ><img src="images/JazzLog-logo-white.png" class="footer-siteLogo"
            /></a>
            <div class="footer-subTitle">♪♪ Jazz for all people ♪♪</div>
          </div>
        </div>
        <!-- /.footer-left -->
        <div class="footer-right">
          <a href="#" class="information1">お問い合わせ</a>
          <a href="#" class="information2">利用規約</a>
        </div>
        <!-- /.footer-right -->
      </div>
      <!-- /.footer-container -->
    </footer>
  </body>
</html>
